name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  core:
    # The pure logic package: needs only Swift 6 on macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Core tests
        working-directory: Packages/CarbStockCore
        run: swift test
      - name: CloudKit schema checker (self test, no network)
        run: python3 -I scripts/pruefe-cloudkit-schema.py --selftest
