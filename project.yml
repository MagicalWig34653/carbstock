name: CarbStock
options:
  bundleIdPrefix: de.linolaske
  developmentLanguage: de
  deploymentTarget:
    iOS: "26.0"
packages:
  CarbStockCore:
    path: Packages/CarbStockCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: J2DU2P47XW
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    CARBSTOCK_CLOUDKIT: "YES"
targets:
  CarbStock:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: CarbStockCore
        product: CarbStockCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.linolaske.carbstock
        PRODUCT_NAME: CarbStock
        # iPhone first (O-04). iPad = "2" later, if it costs nothing extra.
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: App/CarbStock.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: CarbStock
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        # Only Apple system frameworks (CloudKit/TLS): exempt encryption.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Apple Health (M9c): read-only, cycling workouts, start and duration only. Nothing is written or synced.
        INFOPLIST_KEY_NSHealthShareUsageDescription: "CarbStock liest deine Radfahrten (Beginn und Dauer) aus Apple Health, damit du geplante Sessions mit einem Tipp als erledigt markieren kannst. Es werden keine Gesundheitsdaten geschrieben, gespeichert oder per iCloud synchronisiert."
        # App Store Connect verlangt mit der HealthKit-Berechtigung auch den Schreib-Text; die App schreibt nichts.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "CarbStock schreibt keine Daten in Apple Health. Die App liest nur deine Radfahrten (Beginn und Dauer), damit du geplante Sessions als erledigt markieren kannst."
    info:
      path: App/Info.plist
      properties:
        # CloudKit delivers silent change notifications (spec 9.1).
        UIBackgroundModes: [remote-notification]
        # NO for unsigned builds (no iCloud entitlement): CloudKit would trap at start.
        CarbStockCloudKitEnabled: $(CARBSTOCK_CLOUDKIT)
  CarbStockTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AppTests
    dependencies:
      - target: CarbStock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.linolaske.carbstock.tests
        GENERATE_INFOPLIST_FILE: YES
  CarbStockUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AppUITests
    dependencies:
      - target: CarbStock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.linolaske.carbstock.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CarbStock:
    build:
      targets:
        CarbStock: all
        CarbStockTests: [test]
        CarbStockUITests: [test]
    test:
      targets:
        - CarbStockTests
        - CarbStockUITests
      commandLineArguments:
        "-CarbStockInMemory": true
  # DEBUG-Werkzeug (Gate G1): Development-Schema in CloudKit anlegen, siehe docs/G1-SCHEMA-REVIEW.md.
  # Signiert starten, dann in der App „Schema anlegen“ tippen. Läuft nie ohne dieses Startargument.
  CarbStockSchema:
    build:
      targets:
        CarbStock: all
    run:
      config: Debug
      commandLineArguments:
        "-CarbStockCloudKitSchema": true
